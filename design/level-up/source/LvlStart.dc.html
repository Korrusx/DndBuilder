<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый уровень</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0F1114}
a{color:#F2B14A}a:hover{color:#FFC86E}
.lv-ring{stroke-dasharray:503;stroke-dashoffset:503;animation:lvRing 5s cubic-bezier(.45,0,.2,1) infinite}
.lv-old{animation:lvOld 5s ease-in infinite}
.lv-new{opacity:0;animation:lvNew 5s cubic-bezier(.2,1.4,.4,1) infinite}
.lv-burst{opacity:0;animation:lvBurst 5s ease-out infinite}
.lv-glow{animation:lvGlow 5s ease-out infinite}
.lv-c1{animation:lvJump 5s ease-out infinite}
.lv-c2{animation:lvJump2 5s ease-out infinite}
.lv-c3{animation:lvJump3 5s ease-out infinite}
.lv-hint{animation:lvHint 5s ease-out infinite}
@keyframes lvRing{0%,8%{stroke-dashoffset:503}52%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:1}}
@keyframes lvOld{0%,50%{opacity:1;transform:scale(1)}58%,100%{opacity:0;transform:scale(.55)}}
@keyframes lvNew{0%,55%{opacity:0;transform:scale(1.7)}64%{opacity:1;transform:scale(.92)}72%,100%{opacity:1;transform:scale(1)}}
@keyframes lvBurst{0%,55%{opacity:0;transform:scale(.85)}60%{opacity:.9;transform:scale(1)}82%,100%{opacity:0;transform:scale(1.55)}}
@keyframes lvGlow{0%,55%{box-shadow:0 0 0 0 rgba(242,177,74,0)}62%{box-shadow:0 0 60px 10px rgba(242,177,74,.35)}100%{box-shadow:0 0 30px 0 rgba(242,177,74,.12)}}
@keyframes lvJump{0%,64%{transform:none}69%{transform:translateY(-12px) rotate(-3deg)}75%,100%{transform:none}}
@keyframes lvJump2{0%,67%{transform:none}72%{transform:translateY(-12px)}78%,100%{transform:none}}
@keyframes lvJump3{0%,70%{transform:none}75%{transform:translateY(-12px) rotate(3deg)}81%,100%{transform:none}}
@keyframes lvHint{0%,60%{opacity:.35}70%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
.lv-ring,.lv-old,.lv-new,.lv-burst,.lv-glow,.lv-c1,.lv-c2,.lv-c3,.lv-hint{animation:none}
.lv-ring{stroke-dashoffset:0}.lv-old{opacity:0}.lv-new{opacity:1}.lv-hint{opacity:1}
}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(circle at 50% 28%, #241E13 0, #0F1114 60%); color: #F1ECE2; font-family: 'Golos Text', system-ui, sans-serif; display: flex; flex-direction: column; padding: 10px 16px 18px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center">
    <button aria-label="Отложить" style="width: 44px; height: 44px; border: 0; background: transparent; color: #9AA3AE; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 4px">
    <div style="position: relative; width: 184px; height: 184px">
      <div class="lv-glow" style="position: absolute; inset: 12px; border-radius: 80px"></div>
      <div class="lv-burst" style="position: absolute; inset: 0; border-radius: 92px; border: 2px solid #F2B14A"></div>
      <svg width="184" height="184" viewBox="0 0 184 184" aria-hidden="true" style="position: absolute; inset: 0">
        <circle cx="92" cy="92" r="80" fill="none" stroke="#2C323B" stroke-width="6"></circle>
        <circle class="lv-ring" cx="92" cy="92" r="80" fill="none" stroke="#F2B14A" stroke-width="6" stroke-linecap="round" transform="rotate(-90 92 92)"></circle>
      </svg>
      <div role="img" aria-label="Уровень 5 становится 6" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 12px; color: #C9A46A; letter-spacing: 0.1em; margin-bottom: 92px">УРОВЕНЬ</span>
        <span class="lv-old" style="position: absolute; font-family: Unbounded, sans-serif; font-size: 88px; font-weight: 700; color: #6B737D; line-height: 1">5</span>
        <span class="lv-new" style="position: absolute; font-family: Unbounded, sans-serif; font-size: 88px; font-weight: 700; color: #F2B14A; line-height: 1">6</span>
      </div>
    </div>
    <div class="lv-hint" style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 600; text-align: center">Ирма Вейл растёт</div>
      <div style="font-size: 14px; color: #9AA3AE">Плут · Вор · 3 новинки, 1 выбор</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 4px">
    <div class="lv-c1" style="aspect-ratio: 3 / 4; border-radius: 14px; border: 1.5px solid #2C4A38; background: repeating-linear-gradient(45deg, #13201A 0 6px, #16251E 6px 12px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.45)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E9E73" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>
      <span style="font-size: 12px; color: #7FE0A8">Хиты</span>
    </div>
    <div class="lv-c2" style="aspect-ratio: 3 / 4; border-radius: 14px; border: 1.5px solid #5C4A22; background: repeating-linear-gradient(45deg, #1F1A11 0 6px, #241E13 6px 12px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.45); position: relative">
      <span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 4px; background: #F2B14A"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A6A2E" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 7 7 1-5 5 1.5 7L12 18l-6.5 4L7 15 2 10l7-1z"></path></svg>
      <span style="font-size: 12px; color: #C9A46A">Умение</span>
    </div>
    <div class="lv-c3" style="aspect-ratio: 3 / 4; border-radius: 14px; border: 1.5px dashed #3A4049; background: #15181C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.45)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B737D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      <span style="font-size: 12px; color: #9AA3AE">Что дальше</span>
    </div>
  </div>
  <div style="font-size: 12px; color: #6B737D; text-align: center">точка на карте — нужен выбор</div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; color: #9AA3AE; letter-spacing: 0.06em">В КАКОМ КЛАССЕ</div>
    <div role="radiogroup" aria-label="Класс для уровня" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button role="radio" aria-checked="true" style="min-height: 56px; border-radius: 14px; border: 1.5px solid #F2B14A; background: #2B2416; color: #F1ECE2; font-family: 'Golos Text', sans-serif; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 14px; text-align: left"><span style="font-size: 15px; font-weight: 600">Плут 6</span><span style="font-size: 12px; color: #C9BFA9">продолжить путь</span></button>
      <button role="radio" aria-checked="false" style="min-height: 56px; border-radius: 14px; border: 1px solid #2C323B; background: #1A1D22; color: #F1ECE2; font-family: 'Golos Text', sans-serif; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 14px; text-align: left"><span style="font-size: 15px; font-weight: 600">Другой класс</span><span style="font-size: 12px; color: #9AA3AE">мультикласс</span></button>
    </div>
  </div>

  <div style="flex: 1"></div>
  <button style="height: 56px; border-radius: 16px; border: 0; background: #F2B14A; color: #1A1406; font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600">Открыть</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
