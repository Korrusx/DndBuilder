<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магия на новом уровне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0F1114}
a{color:#C9A0FF}a:hover{color:#DCC2FF}
.mg-pop1{animation:mgPop 3.6s cubic-bezier(.2,1.5,.4,1) infinite}
.mg-pop2{animation:mgPop2 3.6s cubic-bezier(.2,1.5,.4,1) infinite}
@keyframes mgPop{0%,15%{transform:scale(0);opacity:0}30%,100%{transform:scale(1);opacity:1}}
@keyframes mgPop2{0%,28%{transform:scale(0);opacity:0}43%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.mg-pop1,.mg-pop2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1114; color: #F1ECE2; font-family: 'Golos Text', system-ui, sans-serif; display: flex; flex-direction: column; padding: 10px 16px 18px; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F1ECE2; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex: 1; text-align: center; font-size: 13px; color: #9AA3AE">Лира · жрица 5 · карта 4 из 6</div>
    <span style="width: 44px"></span>
  </div>

  <div style="border-radius: 20px; border: 1.5px solid #4A3A66; background: #1D1828; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.5)">
    <div style="font-size: 11px; letter-spacing: 0.06em; color: #C9A0FF">МАГИЯ</div>
    <div style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 600; color: #E2D0FF">Открыт 3-й круг</div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 56px; font-size: 12px; color: #9AA3AE">1 круг</span><span style="display: flex; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span></span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 56px; font-size: 12px; color: #9AA3AE">2 круг</span><span style="display: flex; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #C9A0FF"></span></span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 56px; font-size: 12px; color: #E2D0FF; font-weight: 600">3 круг</span><span style="display: flex; gap: 6px"><span class="mg-pop1" style="width: 18px; height: 18px; border-radius: 9px; background: #E2D0FF; box-shadow: 0 0 12px 2px rgba(201,160,255,0.6)"></span><span class="mg-pop2" style="width: 18px; height: 18px; border-radius: 9px; background: #E2D0FF; box-shadow: 0 0 12px 2px rgba(201,160,255,0.6)"></span></span><span style="font-size: 12px; color: #C9A0FF">новые</span></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="flex: 1; font-size: 12px; color: #9AA3AE; letter-spacing: 0.06em">ПОДГОТОВЛЕНО: 7 → 9</span>
      <span style="font-family: Unbounded, sans-serif; font-size: 13px; color: #C9A0FF">2 из 2</span>
    </div>
    <sc-for list="{{spells}}" as="s" hint-placeholder-count="3">
      <button role="checkbox" aria-checked="{{s.checked}}" style="{{s.box}}">
        <span style="{{s.circle}}">{{s.lvl}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 600">{{s.n}}</span><span style="font-size: 12px; color: #9AA3AE">{{s.d}}</span></span>
        <sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A0FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      </button>
    </sc-for>
    <div style="font-size: 12px; color: #9AA3AE">Нажмите и держите, чтобы прочитать описание</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px; border-radius: 14px; background: #1A1D22; border: 1px solid #2C323B; padding: 4px 14px">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px"><span style="flex: 1">Священное пламя</span><span style="font-family: Unbounded, sans-serif; font-size: 12px; color: #9AA3AE">1к8</span><span style="color: #6B737D">→</span><span style="font-family: Unbounded, sans-serif; font-size: 13px; color: #F1ECE2">2к8</span></div>
    <div style="height: 1px; background: #2C323B"></div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px"><span style="flex: 1">Бонус мастерства<span style="display: block; font-size: 11px; color: #9AA3AE">изменилось 11 чисел ›</span></span><span style="font-family: Unbounded, sans-serif; font-size: 12px; color: #9AA3AE">+2</span><span style="color: #6B737D">→</span><span style="font-family: Unbounded, sans-serif; font-size: 13px; color: #F1ECE2">+3</span></div>
  </div>

  <div style="flex: 1"></div>
  <button style="height: 56px; border-radius: 16px; border: 0; background: #F2B14A; color: #1A1406; font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600">Дальше</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var list = [
{ n: "Возрождение", d: "вернуть к жизни умершего не больше минуты назад", lvl: "3", on: true },
{ n: "Духовные стражи", d: "концентрация · урон врагам рядом", lvl: "3", on: true },
{ n: "Рассеивание магии", d: "снять заклинание с цели", lvl: "3", on: false }
];
return { spells: list.map(function (s) {
return {
n: s.n, d: s.d, lvl: s.lvl, on: s.on, checked: s.on ? "true" : "false",
box: "min-height: 56px; border-radius: 14px; font-family: 'Golos Text', sans-serif; color: #F1ECE2; display: flex; align-items: center; gap: 12px; padding: 8px 14px; " + (s.on ? "border: 1.5px solid #8A6CC0; background: #1D1828;" : "border: 1px solid #2C323B; background: #1A1D22;"),
circle: "width: 28px; height: 28px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-size: 12px; font-weight: 600; " + (s.on ? "background: #C9A0FF; color: #1D1828;" : "border: 1.5px solid #4A3A66; color: #C9A0FF;")
};
}) };
}
}
</script>
</body>
</html>
