@keyframes ldSpark{0%,12%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-14px) scale(1)}45%,100%{opacity:0;transform:translateY(-60px) scale(.6)}}

@keyframes ldUi{0%,18%{opacity:0;transform:translateY(12px)}28%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ld-card,.ld-sheen,.ld-s1,.ld-s2,.ld-s3,.ld-ui{animation:none}.ld-sheen,.ld-s1,.ld-s2,.ld-s3{opacity:0}}
