<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор компетентности</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0F1114}
a{color:#F2B14A}a:hover{color:#FFC86E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #08090B; color: #F1ECE2; font-family: 'Golos Text', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="flex: 1; padding: 20px 16px; color: #3A4049; font-size: 13px">Карта «Компетентность» под затемнением</div>

  <div style="background: #1A1D22; border-top: 1px solid #2C323B; border-radius: 22px 22px 0 0; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4049"></div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <div style="flex: 1; font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 600">Компетентность</div>
      <div style="font-family: Unbounded, sans-serif; font-size: 14px; color: #F2B14A">2 из 2</div>
    </div>
    <div style="font-size: 13px; color: #9AA3AE; line-height: 1.4">Только навыки, которыми Ирма владеет. Справа — как изменится бонус.</div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{skills}}" as="k" hint-placeholder-count="4">
        <button role="checkbox" aria-checked="{{k.checked}}" style="{{k.box}}">
          <span style="{{k.tick}}"><sc-if value="{{k.on}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1A1406" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 600">{{k.name}}</span><span style="font-size: 12px; color: #9AA3AE">{{k.hint}}</span></span>
          <span style="font-family: Unbounded, sans-serif; font-size: 13px; color: #9AA3AE">{{k.from}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B737D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="{{k.toS}}">{{k.to}}</span>
        </button>
      </sc-for>
    </div>

    <div style="border-radius: 12px; background: #13261D; color: #A8D9BC; padding: 10px 12px; font-size: 13px; line-height: 1.4">Заодно вырастет пассивное восприятие: <span style="font-family: Unbounded, sans-serif; color: #7FE0A8">14 → 17</span></div>

    <button style="height: 56px; border-radius: 16px; border: 0; background: #F2B14A; color: #1A1406; font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600">Готово</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var list = [
{ name: "Восприятие", hint: "МДР · замечать засады", from: "+4", to: "+7", on: true },
{ name: "Акробатика", hint: "ЛОВ · вырваться из захвата", from: "+7", to: "+10", on: true },
{ name: "Анализ", hint: "ИНТ · ловушки и улики", from: "+5", to: "+8", on: false },
{ name: "Обман", hint: "ХАР · байки для стражи", from: "+3", to: "+6", on: false }
];
return { skills: list.map(function (k) {
return {
name: k.name, hint: k.hint, from: k.from, to: k.to, on: k.on, checked: k.on ? "true" : "false",
box: "min-height: 60px; border-radius: 14px; font-family: 'Golos Text', sans-serif; color: #F1ECE2; display: flex; align-items: center; gap: 10px; padding: 8px 14px; " + (k.on ? "border: 1.5px solid #F2B14A; background: #2B2416;" : "border: 1px solid #2C323B; background: #232831; opacity: 0.7;"),
tick: "width: 22px; height: 22px; border-radius: 6px; box-sizing: border-box; flex: none; display: flex; align-items: center; justify-content: center; " + (k.on ? "background: #F2B14A;" : "border: 2px solid #4A525D;"),
toS: "font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600; width: 36px; text-align: right; " + (k.on ? "color: #F2B14A;" : "color: #9AA3AE;")
};
}) };
}
}
</script>
</body>
</html>
