<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бросок хитов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0F1114}
a{color:#F2B14A}a:hover{color:#FFC86E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1114; color: #F1ECE2; font-family: 'Golos Text', system-ui, sans-serif; display: flex; flex-direction: column; padding: 10px 16px 18px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-label="Назад" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F1ECE2; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex: 1; display: flex; gap: 6px; justify-content: center">
      <span style="width: 28px; height: 4px; border-radius: 2px; background: #F2B14A"></span>
      <span style="width: 28px; height: 4px; border-radius: 2px; background: #2C323B"></span>
      <span style="width: 28px; height: 4px; border-radius: 2px; background: #2C323B"></span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
    <div style="font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 600">Хиты</div>
    <div style="font-size: 14px; color: #9AA3AE">Кость хитов плута — к8</div>
  </div>

  <div style="height: 250px; border-radius: 20px; background: radial-gradient(circle at 50% 45%, #1F2A24 0, #13181A 70%); border: 1px solid #2C323B; display: flex; align-items: center; justify-content: center; position: relative">
    <svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="к8, выпало 6">
      <polygon points="50,4 92,50 50,96 8,50" fill="#F2B14A"></polygon>
      <polygon points="50,4 92,50 50,62 8,50" fill="#FFC86E"></polygon>
      <polygon points="8,50 50,62 50,96" fill="#C98E2E"></polygon>
      <polygon points="92,50 50,62 50,96" fill="#B07A22"></polygon>
      <text x="50" y="46" text-anchor="middle" font-family="Unbounded, sans-serif" font-size="22" font-weight="700" fill="#1A1406">6</text>
    </svg>
    <span style="position: absolute; bottom: 12px; font-size: 12px; color: #6B737D">3D-стол · тряхните телефон, чтобы бросить</span>
  </div>

  <div role="radiogroup" aria-label="Как получить хиты" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <button role="radio" aria-checked="true" style="min-height: 56px; border-radius: 14px; border: 1.5px solid #F2B14A; background: #2B2416; color: #F2B14A; font-family: 'Golos Text', sans-serif; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">Бросить<span style="font-weight: 400; font-size: 11px; color: #C9A46A">выпало 6</span></button>
    <button role="radio" aria-checked="false" style="min-height: 56px; border-radius: 14px; border: 1px solid #2C323B; background: #1A1D22; color: #F1ECE2; font-family: 'Golos Text', sans-serif; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">Среднее<span style="font-size: 11px; color: #9AA3AE">всегда 5</span></button>
    <button role="radio" aria-checked="false" style="min-height: 56px; border-radius: 14px; border: 1px solid #2C323B; background: #1A1D22; color: #F1ECE2; font-family: 'Golos Text', sans-serif; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">Свой кубик<span style="font-size: 11px; color: #9AA3AE">ввести число</span></button>
  </div>

  <div style="border-radius: 16px; background: #13261D; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 14px; color: #A8D9BC">6 на кубике + 2 (ТЕЛ)</span>
      <span style="font-family: Unbounded, sans-serif; font-size: 26px; font-weight: 700; color: #7FE0A8">+8</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-family: Unbounded, sans-serif; font-size: 15px; color: #A8D9BC">38</span>
      <div style="flex: 1; height: 8px; border-radius: 4px; background: #0E1D16; overflow: hidden; display: flex"><span style="width: 82%; background: #4E9E73"></span><span style="width: 18%; background: #7FE0A8"></span></div>
      <span style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600; color: #7FE0A8">46</span>
    </div>
  </div>

  <div style="flex: 1"></div>
  <button style="height: 56px; border-radius: 16px; border: 0; background: #F2B14A; color: #1A1406; font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600">Дальше</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
