<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стили карты героя</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F2B14A}a:hover{color:#FFC86E}
</style>
</helmet>
<div style="width: 1180px; height: 400px; box-sizing: border-box; background: #0B0C0E; color: #F1ECE2; font-family: 'Golos Text', system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; padding: 28px 40px">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 600">{{t.name}}</span>
        <span style="font-size: 12px; color: #9AA3AE">{{t.note}}</span>
      </div>
      <div style="{{t.frame}}">
        <div style="{{t.inner}}">
          <div aria-hidden="true" style="{{t.rule}}"></div>
          <div style="position: relative; width: 96px; height: 96px">
            <div style="{{t.ring}}"><div style="{{t.face}}">И</div></div>
            <div style="{{t.badge}}">6</div>
          </div>
          <div style="{{t.nameS}}">Ирма Вейл</div>
          <div style="{{t.subS}}">Полурослик · Плут · Вор</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; position: relative">
            <sc-for list="{{t.stats}}" as="s" hint-placeholder-count="3">
              <div style="{{t.statBox}}"><span style="{{t.statL}}">{{s.l}}</span><span style="{{t.statV}}">{{s.v}}</span><span style="{{t.statD}}">{{s.d}}</span></div>
            </sc-for>
          </div>
          <div style="{{t.newS}}">Компетентность: Восприятие и Акробатика</div>
          <div style="{{t.foot}}"><span>Тени Солёной Гавани · сессия 12</span><span>КУБИКОД</span></div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":400}}'>
class Component extends DCLogic {
renderVals() {
var defs = [
{ name: "Янтарь", note: "по умолчанию, как приложение",
  frameBg: "linear-gradient(150deg, #FFD58A 0%, #8A6A2E 30%, #3A2E18 55%, #C9933A 80%, #FFE2A8 100%)", glow: "0 0 50px rgba(242,177,74,0.18)",
  innerBg: "radial-gradient(circle at 50% 0%, #3A2E18 0, #1C1812 55%, #141210 100%)", rule: "rgba(242,177,74,0.28)",
  ring: "conic-gradient(from 210deg, #FFE2A8, #F2B14A, #8A6A2E, #F2B14A, #FFE2A8)", face: "radial-gradient(circle at 40% 35%, #4A3A1E 0, #241D12 70%)", faceC: "#F2B14A",
  badgeBg: "#F2B14A", badgeC: "#1A1406", badgeB: "#1C1812", text: "#FFF4DE", sub: "#C9BFA9", accent: "#C9A46A", good: "#7FE0A8",
  statBg: "rgba(15,17,20,0.55)", statB: "#3A3222", newBg: "rgba(242,177,74,0.08)", newB: "rgba(242,177,74,0.22)", foot: "#8A806C",
  nameF: "Unbounded, sans-serif", nameW: 600, nameSize: 20, body: "'Golos Text', sans-serif", num: "Unbounded, sans-serif" },
{ name: "Ночь", note: "для заклинателей и тёмных историй",
  frameBg: "linear-gradient(150deg, #E6D6FF 0%, #6B58A8 30%, #241D3D 55%, #8FB8FF 80%, #E6D6FF 100%)", glow: "0 0 50px rgba(201,160,255,0.18)",
  innerBg: "radial-gradient(circle at 50% 0%, #2E2650 0, #17142A 55%, #100E1C 100%)", rule: "rgba(201,160,255,0.28)",
  ring: "conic-gradient(from 210deg, #E6D6FF, #C9A0FF, #4A3A80, #8FB8FF, #E6D6FF)", face: "radial-gradient(circle at 40% 35%, #3E3470 0, #1C1838 70%)", faceC: "#DCC2FF",
  badgeBg: "#C9A0FF", badgeC: "#17142A", badgeB: "#17142A", text: "#F3EEFF", sub: "#A9A3C9", accent: "#B49AE0", good: "#9FD8FF",
  statBg: "rgba(10,8,20,0.5)", statB: "#3A3360", newBg: "rgba(201,160,255,0.08)", newB: "rgba(201,160,255,0.24)", foot: "#7D7799",
  nameF: "Unbounded, sans-serif", nameW: 600, nameSize: 20, body: "'Golos Text', sans-serif", num: "Unbounded, sans-serif" },
{ name: "Пергамент", note: "в стиле PDF-листа",
  frameBg: "#7B2D26", glow: "0 0 0 rgba(0,0,0,0)",
  innerBg: "radial-gradient(circle at 50% 0%, #FBF5E6 0, #F3EAD3 60%, #E9DCBE 100%)", rule: "rgba(123,45,38,0.45)",
  ring: "#7B2D26", face: "radial-gradient(circle at 40% 35%, #FBF5E6 0, #E9DCBE 70%)", faceC: "#7B2D26",
  badgeBg: "#7B2D26", badgeC: "#F3EAD3", badgeB: "#F3EAD3", text: "#1B2A4A", sub: "#5A5246", accent: "#7B2D26", good: "#2E6B47",
  statBg: "rgba(123,45,38,0.05)", statB: "#D9C9A6", newBg: "rgba(27,42,74,0.05)", newB: "#D9C9A6", foot: "#7A6E5A",
  nameF: "'Alegreya SC', Georgia, serif", nameW: 700, nameSize: 26, body: "'IBM Plex Sans Condensed', sans-serif", num: "'Alegreya SC', Georgia, serif" }
];
var stats = [{ l: "ХИТЫ", v: "46", d: "+8" }, { l: "ВОСПРИЯТИЕ", v: "+7", d: "+3" }, { l: "АКРОБАТИКА", v: "+10", d: "+3" }];
return { themes: defs.map(function (d) {
return {
name: d.name, note: d.note, stats: stats,
frame: "border-radius: 22px; padding: 2px; background: " + d.frameBg + "; box-shadow: 0 20px 50px rgba(0,0,0,0.6), " + d.glow + ";",
inner: "position: relative; overflow: hidden; border-radius: 20px; background: " + d.innerBg + "; padding: 18px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: " + d.body + ";",
rule: "position: absolute; inset: 7px; border-radius: 14px; border: 1px solid " + d.rule + ";",
ring: "position: absolute; inset: 0; border-radius: 48px; background: " + d.ring + "; padding: 3px; box-sizing: border-box;",
face: "width: 100%; height: 100%; border-radius: 45px; background: " + d.face + "; display: flex; align-items: center; justify-content: center; font-family: " + d.nameF + "; font-size: 38px; font-weight: 600; color: " + d.faceC + ";",
badge: "position: absolute; right: -6px; bottom: -4px; width: 40px; height: 40px; border-radius: 20px; background: " + d.badgeBg + "; border: 3px solid " + d.badgeB + "; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: " + d.num + "; font-size: 18px; font-weight: 700; color: " + d.badgeC + ";",
nameS: "position: relative; font-family: " + d.nameF + "; font-size: " + d.nameSize + "px; font-weight: " + d.nameW + "; color: " + d.text + "; line-height: 1.1;",
subS: "position: relative; font-size: 12px; color: " + d.sub + "; margin-top: -4px;",
statBox: "border-radius: 12px; background: " + d.statBg + "; border: 1px solid " + d.statB + "; padding: 7px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px;",
statL: "font-size: 9px; letter-spacing: 0.08em; color: " + d.accent + ";",
statV: "font-family: " + d.num + "; font-size: 17px; font-weight: 600; color: " + d.text + ";",
statD: "font-size: 10px; color: " + d.good + ";",
newS: "position: relative; width: 100%; box-sizing: border-box; border-radius: 12px; background: " + d.newBg + "; border: 1px solid " + d.newB + "; padding: 8px 10px; font-size: 12px; color: " + d.text + "; line-height: 1.35;",
foot: "position: relative; width: 100%; display: flex; justify-content: space-between; font-size: 10px; color: " + d.foot + "; letter-spacing: 0.02em;"
};
}) };
}
}
</script>
</body>
</html>
